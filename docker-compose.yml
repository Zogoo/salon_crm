services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3011:3000"
    environment:
      RAILS_ENV: development
      DATABASE_PATH: /data/development.sqlite3
      JWT_SECRET: 2a4516f8a4c5c1d4b9eae467aaa8be74077276f08874dde6ed9805eab120aa4b
      CORS_ORIGINS: "http://localhost:4211"
      RAILS_LOG_TO_STDOUT: "true"
      APP_HOST: localhost
      APP_PORT: 3011
      APP_FRONTEND_URL: http://localhost:4211
      MAILER_DOMAIN: mongolianmassagelab.com
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      ACTIVE_STORAGE_SERVICE: fly
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio-secret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      BUCKET_NAME: massagelab-files
    depends_on:
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - sqlite_dev_data:/data
      - /app/frontend
    stdin_open: true
    tty: true
    command: >
      bash -c "
        bundle install &&
        bundle exec rails db:prepare &&
        bundle exec puma -C config/puma.rb
      "

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: test
      # Off the bind mount: SQLite file locking is unreliable over the
      # macOS/virtiofs share, which makes the concurrency specs flaky.
      DATABASE_PATH: /tmp/test.sqlite3
      JWT_SECRET: test-jwt-secret
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - /app/frontend
    command: >
      bash -c "
        bundle install &&
        bin/rails db:test:prepare &&
        bundle exec rspec
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4211:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1035:1025"
      - "8035:8025"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio-secret; do sleep 1; done &&
      mc mb --ignore-existing local/massagelab-files &&
      mc anonymous set private local/massagelab-files
      "

volumes:
  bundle_cache:
  sqlite_dev_data:
  frontend_node_modules:
  minio_data:
