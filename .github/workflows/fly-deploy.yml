# Deploy to Fly.io. Needs a provisioned Fly app and a FLY_API_TOKEN secret on
# the `production` environment — see docs/engineering/07-deployment.md.
#
# The whole CI workflow — security scans, lint, RSpec, Vitest and the
# end-to-end suite against the production image — runs inside this workflow,
# and `deploy` needs it. No path ships a commit that has not passed all of it:
# not a push to main, and not the manual "Run workflow" button either.
name: Fly Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy app
    needs: ci
    # A manual run from another branch still tests it, but never ships it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
