# Deploy to Fly.io after CI passes on main. Needs a provisioned Fly app and a
# FLY_API_TOKEN repository secret — see docs/engineering/07-deployment.md.
name: Fly Deploy

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    # workflow_run fires for failed runs too, so only ship a green commit.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run would otherwise check out the branch tip, which may
          # have moved on. Deploy the exact commit CI went green on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
